AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-${AWS::AccountId}"

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Origins:
          - Id: proxy-api
            DomainName: !Sub "${ProxyApi}.execute-api.${AWS::Region}.amazonaws.com"
            OriginPath: /Prod
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: proxy-api
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - PATCH
            - POST
            - DELETE
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled managed policy
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader managed policy

  ProxyApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub "${AWS::StackName}-proxy"
      StageName: Prod

  Function:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}"
      PackageType: Image
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          REGISTRY_STORAGE_S3_REGION: !Ref AWS::Region
          REGISTRY_STORAGE_S3_BUCKET: !Ref Bucket
          REGISTRY_STORAGE_TAG_CONCURRENCYLIMIT: "8"
          REGISTRY_STORAGE_MAINTENANCE_READONLY: '{"enabled":true}'
          REGISTRY_AUTH_HTPASSWD_REALM: basic-realm
          REGISTRY_AUTH_HTPASSWD_PATH: /etc/distribution/.htpasswd
          AWS_LWA_REMOVE_BASE_PATH: /Prod
      Events:
        ProxyApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProxyApi
      Policies:
        # https://distribution.github.io/distribution/storage-drivers/s3/#s3-permission-scopes
        - Statement:
            - Effect: Allow
              Action:
                - s3:ListBucket
                - s3:GetBucketLocation
                - s3:ListBucketMultipartUploads
              Resource: !GetAtt Bucket.Arn
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
                - s3:ListMultipartUploadParts
                - s3:AbortMultipartUpload
              Resource: !Sub "${Bucket.Arn}/*"
    Metadata:
      DockerContext: ./
      Dockerfile: Dockerfile
      DockerTag: latest

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Function}"
      RetentionInDays: 7

Outputs:
  Server:
    Value: !GetAtt Distribution.DomainName
